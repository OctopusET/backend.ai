[alembic]
script_location = /app/src/ai/backend/manager/models/alembic
sqlalchemy.url = postgresql://postgres:develove@127.0.0.1:8100/backend

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
