[etcd]
namespace = "local"
addr = { host = "127.0.0.1", port = 8120 }
user = ""
password = ""


[db]
type = "postgresql"
addr = { host = "127.0.0.1", port = 8100 }
name = "backend"
user = "postgres"
password = "changeme"
pool-recycle = 50
pool-pre-ping = false


[manager]
num-proc = 1
service-addr = { host = "0.0.0.0", port = 8081 }
internal-addr = { host = "0.0.0.0", port = 18080 }
ssl-enabled = false
heartbeat-timeout = 40.0
pid-file = "./manager.pid"
disabled-plugins = []
hide-agents = true
agent-selection-resource-priority = ["cuda", "rocm", "tpu", "cpu", "mem"]

[docker-registry]
ssl-verify = false

[pyroscope]
enabled = false


[logging]
level = "DEBUG"
drivers = ["console"]

[logging.pkg-ns]
"" = "WARNING"
"aiotools" = "INFO"
"aiohttp" = "INFO"
"ai.backend" = "DEBUG"
"alembic" = "INFO"
"sqlalchemy" = "WARNING"

[logging.console]
colored = true
format = "verbose"


[debug]
enabled = true

[otel]
enabled = false
