[etcd]
namespace = "${BA_NAMESPACE:-local}"
addr = { host = "${BA_ETCD_HOST:-127.0.0.1}", port = "${BA_ETCD_PORT:-8120}" }
user = ""
password = ""


[agent]
mode = "docker"
rpc-listen-addr = { host = "127.0.0.1", port = 6001 }
# metric API service address
service-addr = { host = "0.0.0.0", port = 6003 }
ssl-enabled = false
#ssl-cert = ""
#ssl-key = ""
agent-sock-port = 6007
# id = "i-something-special"
scaling-group = "default"
pid-file = "${BA_PID_FILE:-./agent.pid}"
event-loop = "uvloop"
# ipc-base-path = "/tmp/backend.ai/ipc"
var-base-path = "${BA_VAR_BASE_PATH:-./var/lib/backend.ai}"
# allow-compute-plugins = []
# block-compute-plugins = []
image-commit-path = "${BA_IMAGE_COMMIT_PATH:-./tmp/backend.ai/commit/}"
mount-path = "./vfroot/local"
cohabiting-storage-proxy = true
metadata-server-port = 40228


[container]
port-range = [30000, 31000]
kernel-uid = -1
kernel-gid = -1
bind-host = "${BA_BIND_HOST_OVERRIDE:-127.0.0.1}"
sandbox-type = "docker"
scratch-type = "hostdir"
scratch-root = "${BA_SCRATCH_ROOT:-./scratches}"
scratch-size = "1G"


[watcher]
service-addr = { host = "127.0.0.1", port = 6009 }
ssl-enabled = false
#ssl-cert = ""
#ssl-key = ""
target-service = "backendai-agent.service"
soft-reset-available = false


[pyroscope]
enabled = false
app-name = "backendai-half-agent"
server-addr = "http://localhost:4040"
sample-rate = 100


[logging]
level = "INFO"
drivers = ["console"]

[logging.pkg-ns]
"" = "WARNING"
"aiodocker" = "INFO"
"aiotools" = "INFO"
"aiohttp" = "INFO"
"ai.backend" = "INFO"

[logging.console]
colored = true
format = "verbose"

[logging.file]
path = "./logs"
filename = "agent.log"
rotation-size = "10M"

[logging.logstash]
endpoint = { host = "localhost", port = 9300 }
protocol = "tcp"
ssl-enabled = true
ssl-verify = false

[logging.graylog]
host = "127.0.0.1"
port = 12201
ssl-verify = false
ca-certs = ""
keyfile = ""
certfile = ""

[resource]
reserved-cpu = 1
reserved-mem = "1G"
reserved-disk = "8G"
allocation-order = ["cuda", "rocm", "tpu", "cpu", "mem"]
affinity-policy = "INTERLEAVED"


[debug]
enabled = true
skip-container-deletion = false

[debug.coredump]
enabled = false
path = "./coredumps"
backup-count = 10
size-limit = "64M"

[otel]
enabled = false
log-level = "INFO"
endpoint = "http://127.0.0.1:4317"
