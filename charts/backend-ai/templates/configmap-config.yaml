apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend-ai.fullname" . }}-config
  labels:
    {{- include "backend-ai.labels" . | nindent 4 }}
data:
  {{- $root := . }}
  {{- range $path, $_ := .Files.Glob "files/**" }}
  {{ base $path }}: |-
{{ $root.Files.Get $path | indent 4 }}
  {{- end }}
