## Backend.AI - Docker Compose deployment
##
## Usage:
##   make setup   # one-time init (DB, etcd, fixtures)
##   make up      # start all services
##   make down    # stop all services
##   make logs    # tail service logs
##
## Data: $BACKENDAI_HOME (default: $HOME/.backendai)
## Network: host mode (agent creates sibling containers via docker.sock)

x-base: &base
  build:
    context: .
    dockerfile: docker/backend.ai-dev.Dockerfile

services:

  # --- Infrastructure ---

  halfstack-db:
    image: postgres:16.3-alpine
    restart: unless-stopped
    ports: ["8100:5432"]
    environment:
      POSTGRES_DB: ${BACKENDAI_DB_NAME:-backend}
      POSTGRES_PASSWORD: ${BACKENDAI_DB_PASSWORD:-changeme}
    volumes:
      - half-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  halfstack-redis:
    image: redis:7.2.11-alpine
    restart: unless-stopped
    ports: ["8110:6379"]
    volumes:
      - half-redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  halfstack-etcd:
    image: quay.io/coreos/etcd:v3.5.14
    restart: unless-stopped
    ports: ["8120:2379"]
    volumes:
      - half-etcd:/etcd-data
    command: >-
      /usr/local/bin/etcd
      --name backendai-etcd
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://0.0.0.0:2380
      --initial-cluster backendai-etcd=http://0.0.0.0:2380
      --initial-cluster-token backendai-etcd-token
      --initial-cluster-state new
      --enable-v2=true
      --auto-compaction-retention 1
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Init (one-shot, run via `make setup`) ---

  init:
    <<: *base
    network_mode: host
    volumes:
      - ./configs/manager/halfstack-docker.toml:/app/manager.toml:ro
      - ./configs/manager/alembic.ini:/app/alembic.ini:ro
      - ./configs/storage-proxy/ssl:/app/ssl
      - ${BACKENDAI_HOME}:${BACKENDAI_HOME}
    environment:
      ALEMBIC_INI: /app/alembic.ini
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${BACKENDAI_DB_PASSWORD:-changeme}@${BACKENDAI_DB_ADDR:-127.0.0.1:8100}/backend
      MANAGER_CONF: /app/manager.toml
      ADMIN_EMAIL: ${BACKENDAI_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${BACKENDAI_ADMIN_PASSWORD:-changeme}
      DB_ADDR: ${BACKENDAI_DB_ADDR:-127.0.0.1:8100}
      DB_PASSWORD: ${BACKENDAI_DB_PASSWORD:-changeme}
      BACKENDAI_HOME: ${BACKENDAI_HOME}
    entrypoint: ["/bin/bash", "/app/scripts/init-manager.sh"]
    depends_on:
      halfstack-db: { condition: service_healthy }
      halfstack-etcd: { condition: service_healthy }
    profiles: ["init"]

  init-appproxy:
    <<: *base
    network_mode: host
    volumes:
      - ./configs/appproxy/coordinator.toml:/app/app-proxy-coordinator.toml:ro
      - ./src/ai/backend/install/configs/alembic-appproxy.ini:/app/alembic-appproxy.ini:ro
    environment:
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://appproxy:${BACKENDAI_DB_PASSWORD:-changeme}@${BACKENDAI_DB_ADDR:-127.0.0.1:8100}/appproxy
    entrypoint: >-
      python -m ai.backend.cli app-proxy-coordinator
      -f /app/app-proxy-coordinator.toml
      schema oneshot
      -f /app/alembic-appproxy.ini
    depends_on:
      init: { condition: service_completed_successfully }
      halfstack-db: { condition: service_healthy }
    profiles: ["init"]

  krunner-setup:
    <<: *base
    volumes:
      - ${BACKENDAI_HOME}:${BACKENDAI_HOME}
    environment:
      BACKENDAI_HOME: ${BACKENDAI_HOME}
    entrypoint: ["/bin/bash", "-c", "cp -a /app/src/ai/backend/runner/* $BACKENDAI_HOME/runner/ 2>/dev/null; echo 'krunner extracted'"]
    depends_on:
      init: { condition: service_completed_successfully }
    profiles: ["init"]

  # --- Services (run via `make up`) ---

  manager:
    <<: *base
    user: root
    network_mode: host
    volumes:
      - ./configs/manager/halfstack-docker.toml:/app/manager.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BACKEND_DB_PASSWORD: ${BACKENDAI_DB_PASSWORD:-changeme}
    command: ["python", "-m", "ai.backend.cli", "mgr", "start-server", "--debug"]
    depends_on:
      halfstack-db: { condition: service_healthy }
      halfstack-redis: { condition: service_healthy }
      halfstack-etcd: { condition: service_healthy }
    profiles: ["services"]

  webserver:
    <<: *base
    network_mode: host
    volumes:
      - ./configs/webserver/halfstack-docker.conf:/app/webserver.conf:ro
    command: ["python", "-m", "ai.backend.cli", "web", "start-server", "--debug"]
    depends_on:
      halfstack-db: { condition: service_healthy }
      halfstack-redis: { condition: service_healthy }
      halfstack-etcd: { condition: service_healthy }
    profiles: ["services"]

  graphql-gateway:
    image: ghcr.io/graphql-hive/gateway:2.1.12
    network_mode: host
    command: ["supergraph"]
    environment:
      HOST: 0.0.0.0
      PORT: 4000
    volumes:
      - ./configs/graphql/supergraph.graphql:/gateway/supergraph.graphql:ro
      - ./configs/graphql/gateway-docker.config.ts:/gateway/gateway.config.ts:ro
    profiles: ["services"]

  storage-proxy:
    <<: *base
    user: root
    network_mode: host
    volumes:
      - ./configs/storage-proxy/storage-proxy.toml:/app/storage-proxy.toml:ro
      - ./configs/storage-proxy/ssl:/app/configs/storage-proxy/ssl:ro
      - ${BACKENDAI_HOME}/vfolders:${BACKENDAI_HOME}/vfolders
    command: ["python", "-m", "ai.backend.cli", "storage", "start-server", "--debug"]
    depends_on:
      halfstack-redis: { condition: service_healthy }
      halfstack-etcd: { condition: service_healthy }
    profiles: ["services"]

  appproxy-coordinator:
    <<: *base
    user: root
    network_mode: host
    volumes:
      - ./configs/appproxy/coordinator.toml:/app/app-proxy-coordinator.toml:ro
    command: ["python", "-m", "ai.backend.cli", "app-proxy-coordinator", "start-server", "--debug"]
    depends_on:
      halfstack-db: { condition: service_healthy }
      halfstack-redis: { condition: service_healthy }
    profiles: ["services"]

  appproxy-worker:
    <<: *base
    user: root
    network_mode: host
    volumes:
      - ./configs/appproxy/worker.toml:/app/app-proxy-worker.toml:ro
    command: ["python", "-m", "ai.backend.cli", "app-proxy-worker", "start-server", "--debug"]
    depends_on:
      halfstack-redis: { condition: service_healthy }
    profiles: ["services"]

  agent:
    <<: *base
    privileged: true
    user: root
    network_mode: host
    ipc: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/tenstorrent:/dev/tenstorrent
      - /dev/hugepages-1G:/dev/hugepages-1G
      - /sys:/sys:ro
      - ${BACKENDAI_HOME}:${BACKENDAI_HOME}
      - ./configs/agent/halfstack-docker.toml:/app/agent.toml:ro
    environment:
      BACKEND_SCRATCH_ROOT: ${BACKENDAI_HOME}/scratches
      BACKEND_VAR_BASE_PATH: ${BACKENDAI_HOME}/var
      BACKEND_IMAGE_COMMIT_PATH: ${BACKENDAI_HOME}/var/commit
    depends_on:
      halfstack-db: { condition: service_healthy }
      halfstack-redis: { condition: service_healthy }
      halfstack-etcd: { condition: service_healthy }
    profiles: ["services"]

volumes:
  half-db:
  half-redis:
  half-etcd:
